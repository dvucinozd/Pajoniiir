name: Remove confirmed dead audio APIs

on:
  push:
    branches:
      - tmp/ordered-cleanup
    paths:
      - tools/remove_confirmed_dead_audio_apis.py
      - .github/workflows/remove-confirmed-dead-audio-apis.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ordered-cleanup
          fetch-depth: 0
      - name: Audit and remove dead APIs
        run: python3 tools/remove_confirmed_dead_audio_apis.py
      - name: Run P4 host regressions
        shell: pwsh
        run: ./tests/run_p4_host_tests_current.ps1
      - name: Verify diff
        run: git diff --check
      - name: Commit cleanup and self-clean
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm tools/remove_confirmed_dead_audio_apis.py .github/workflows/remove-confirmed-dead-audio-apis.yml
          git add firmware/main-deck-p4/components/audio_engine tests
          git commit -m "refactor(audio): remove confirmed dead helper APIs"
          git push origin HEAD:tmp/ordered-cleanup
