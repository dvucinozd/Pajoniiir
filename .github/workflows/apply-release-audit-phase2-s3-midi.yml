name: Apply release audit phase 2 S3 MIDI

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - "tools/apply_release_audit_phase2_s3_midi.py"
      - ".github/workflows/apply-release-audit-phase2-s3-midi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0

      - name: Correct helper ordering before execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_release_audit_phase2_s3_midi.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'if (!should_refresh_connection_state() || !s_host.opened || !s_host.claimed || s_host.closing) {',
              'if (!should_refresh_connection_state()) {'
          )
          s = s.replace(
              'if (__atomic_exchange_n(&s_connection_refresh_requested, false, __ATOMIC_ACQ_REL)) {\n            publish_connection_refresh_from_usb_owner();\n        }',
              'if (__atomic_exchange_n(&s_connection_refresh_requested, false, __ATOMIC_ACQ_REL) &&\n            s_host.opened && s_host.claimed && !s_host.closing) {\n            publish_connection_refresh_from_usb_owner();\n        }'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply S3 MIDI ownership and parser fixes
        run: python3 tools/apply_release_audit_phase2_s3_midi.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Compile and run focused host test
        run: |
          cd tests/flx4_midi_host
          gcc -Wall -Wextra -Wpedantic -std=c99 \
            -DFLX4_MIDI_HOST_PC_TEST \
            -I../control_link_protocol/stubs \
            -I../../firmware/control-board-s3/components/flx4_midi_host/include \
            -o test_flx4_midi_host.exe \
            test_flx4_midi_host.c \
            ../../firmware/control-board-s3/components/flx4_midi_host/flx4_midi_host.c
          ./test_flx4_midi_host.exe

      - name: Commit S3 MIDI fixes
        run: |
          if git diff --quiet -- firmware/control-board-s3/components/flx4_midi_host/flx4_midi_host.c tests/flx4_midi_host/test_flx4_midi_host.c; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/control-board-s3/components/flx4_midi_host/flx4_midi_host.c \
                  tests/flx4_midi_host/test_flx4_midi_host.c
          git commit -m "fix(s3): serialize connection refresh and MIDI endpoints"
          git push origin HEAD:fix/release-blockers-and-concurrency
