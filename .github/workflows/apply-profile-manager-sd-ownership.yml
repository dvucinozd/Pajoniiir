name: Apply profile manager SD ownership

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - tools/apply_profile_manager_sd_ownership.py
      - .github/workflows/apply-profile-manager-sd-ownership.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0
      - name: Patch ownership
        run: python3 tools/apply_profile_manager_sd_ownership.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 's_descriptor_q' firmware/main-deck-p4/components/controller_profile_manager/controller_profile_manager.c
          grep -q 'sd_io_gate_recorder_active' firmware/main-deck-p4/components/controller_profile_manager/controller_profile_manager.c
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add firmware/main-deck-p4/components/controller_profile_manager/controller_profile_manager.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(p4): move profile SD work off UART and manager lock"
          git pull --rebase origin fix/release-blockers-and-concurrency
          git push origin HEAD:fix/release-blockers-and-concurrency
