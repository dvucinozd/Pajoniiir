name: Apply release audit phase 9 loops

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - tools/apply_release_audit_phase9_authoritative_loops.py
      - .github/workflows/apply-release-audit-phase9-loops.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_release_audit_phase9_authoritative_loops.py
      - name: Test P4 host suite
        shell: pwsh
        run: |
          git diff --check
          & ./tests/run_p4_host_tests.ps1
          exit $LASTEXITCODE
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add firmware/main-deck-p4/components/deck_core firmware/main-deck-p4/components/web_server/web_server.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(p4): route web loops through deck actor"
          git pull --rebase origin fix/release-blockers-and-concurrency
          git push origin HEAD:fix/release-blockers-and-concurrency
