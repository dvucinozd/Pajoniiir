name: Temporary P3 immutable library validation

on:
  pull_request:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - ".github/workflows/export-p3-head.yml"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply immutable-library patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/p3.patch
          git apply --check /tmp/p3.patch
          git apply /tmp/p3.patch
          git diff --check

      - name: Run P4 host regression suites
        shell: bash
        run: |
          set -o pipefail
          pwsh -File ./tests/run_p4_host_tests_current.ps1 2>&1 | tee p4-host-tests.log

      - name: Run pinned UI simulator screenshot gate
        shell: bash
        run: |
          set -o pipefail
          pwsh -File ./tests/ui_simulator/run_ui_simulator_e2e.ps1 2>&1 | tee ui-simulator.log

      - name: Publish one atomic commit
        shell: bash
        env:
          EXPECTED_BASE: fa15d198f51253ebb9b1055ddd79ce3fcc643756
          TARGET_BRANCH: fix/release-blockers-and-concurrency
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-p3-head.yml
          git add \
            docs/fixevi-remediation-audit.md \
            firmware/main-deck-p4/CLAUDE.md \
            firmware/main-deck-p4/components/library/include/library.h \
            firmware/main-deck-p4/components/library/library.c \
            tests/library_anlz/test_library_anlz.c \
            tests/library_anlz/test_library_anlz_current.c \
            tests/run_p4_host_tests_current.ps1
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            docs/fixevi-remediation-audit.md \
            firmware/main-deck-p4/CLAUDE.md \
            firmware/main-deck-p4/components/library/include/library.h \
            firmware/main-deck-p4/components/library/library.c \
            tests/library_anlz/test_library_anlz.c \
            tests/library_anlz/test_library_anlz_current.c \
            tests/run_p4_host_tests_current.ps1 | sort)
          test "$actual" = "$expected"
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'perf(library): sort immutable tracks by compact order' | git commit-tree "$tree" -p "$EXPECTED_BASE")
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "Published $commit"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-immutable-library-validation
          if-no-files-found: ignore
          path: |
            p4-host-tests.log
            ui-simulator.log
