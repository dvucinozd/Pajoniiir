name: Temporary P3 base tree export

on:
  pull_request:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - ".github/workflows/export-p3-head.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve working-branch base tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/release-blockers-and-concurrency
          git rev-parse 'origin/fix/release-blockers-and-concurrency^{tree}' > base-tree.txt
          cat base-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p3-base-tree
          path: base-tree.txt
          if-no-files-found: error
