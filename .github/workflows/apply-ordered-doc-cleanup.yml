name: Apply ordered documentation cleanup

on:
  push:
    branches:
      - tmp/ordered-cleanup
    paths:
      - tools/apply_claude_idf6_docs.py
      - .github/workflows/apply-ordered-doc-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ordered-cleanup
          fetch-depth: 0
      - name: Refresh current guide
        run: python3 tools/apply_claude_idf6_docs.py
      - name: Verify stale markers are gone
        run: |
          git diff --check
          ! grep -q 'CONFIG_ESP32P4_REV_MIN_FULL=0' firmware/main-deck-p4/CLAUDE.md
          ! grep -q 'esp-idf-v5.5' firmware/main-deck-p4/CLAUDE.md
          ! grep -q 'display triple buffering' firmware/main-deck-p4/CLAUDE.md
          grep -q 'ESP-IDF environment.*6.0.2' firmware/main-deck-p4/CLAUDE.md
          grep -q 'BSP_LCD_FRAMEBUFFER_COUNT == 1' firmware/main-deck-p4/CLAUDE.md
      - name: Commit refreshed guide and self-clean
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm tools/apply_claude_idf6_docs.py .github/workflows/apply-ordered-doc-cleanup.yml
          git add firmware/main-deck-p4/CLAUDE.md
          git commit -m "docs(p4): align developer guide with IDF 6 runtime"
          git push origin HEAD:tmp/ordered-cleanup
