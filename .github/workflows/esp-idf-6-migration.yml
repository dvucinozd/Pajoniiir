name: ESP-IDF 6.0.2 migration

on:
  push:
    branches:
      - migration/esp-idf-6.0.2
  pull_request:
    paths:
      - "firmware/**"
      - "tests/**"
      - ".github/workflows/esp-idf-6-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MIGRATION_BRANCH: migration/esp-idf-6.0.2

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone migration branch and run host tests
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch $env:MIGRATION_BRANCH https://github.com/dvucinozd/Pajoniiir.git repo
          Set-Location repo
          & ./tests/run_s3_host_tests.ps1 *> s3-host-tests.log
          $s3 = $LASTEXITCODE
          Get-Content s3-host-tests.log -Tail 30
          if ($s3 -ne 0) { exit $s3 }
          & ./tests/run_p4_host_tests.ps1 *> p4-host-tests.log
          $p4 = $LASTEXITCODE
          Get-Content p4-host-tests.log -Tail 60
          exit $p4

  build-s3:
    name: ESP32-S3 firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
      env:
        HOME: /tmp
        IDF_GIT_SAFE_DIR: "*"
    steps:
      - name: Clone and build control board
        run: |
          git clone --quiet --depth 1 --branch "$MIGRATION_BRANCH" https://github.com/dvucinozd/Pajoniiir.git repo
          cd repo/firmware/control-board-s3
          set +e
          {
            idf.py --version
            rm -rf build sdkconfig sdkconfig.old managed_components
            idf.py set-target esp32s3
            idf.py build
          } > idf-build.log 2>&1
          code=$?
          tail -n 90 idf-build.log
          exit $code
      - name: Upload S3 binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: control-board-s3-idf-6.0.2
          path: |
            repo/firmware/control-board-s3/build/*.bin
            repo/firmware/control-board-s3/build/*.elf
            repo/firmware/control-board-s3/build/*.map
            repo/firmware/control-board-s3/dependencies.lock

  build-p4:
    name: ESP32-P4 firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
      env:
        HOME: /tmp
        IDF_GIT_SAFE_DIR: "*"
    steps:
      - name: Clone and build main deck
        run: |
          git clone --quiet --depth 1 --branch "$MIGRATION_BRANCH" https://github.com/dvucinozd/Pajoniiir.git repo
          cd repo/firmware/main-deck-p4
          set +e
          {
            idf.py --version
            rm -rf build sdkconfig sdkconfig.old managed_components
            idf.py set-target esp32p4
            idf.py build
          } > idf-build.log 2>&1
          code=$?
          tail -n 100 idf-build.log
          exit $code
      - name: Upload P4 binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-deck-p4-idf-6.0.2
          path: |
            repo/firmware/main-deck-p4/build/*.bin
            repo/firmware/main-deck-p4/build/*.elf
            repo/firmware/main-deck-p4/build/*.map
            repo/firmware/main-deck-p4/dependencies.lock
