name: Temporary selected API source export

on:
  pull_request:
    paths:
      - ".github/workflows/esp-idf-6-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sources:
    name: Export selected API sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: selected-api-source-snapshot
          if-no-files-found: error
          path: |
            firmware/main-deck-p4/components/library/library.c
            firmware/main-deck-p4/components/library/library_duration_fixed.c
            firmware/main-deck-p4/components/ui/ui.c
            firmware/main-deck-p4/components/ui/ui_library.c
            firmware/main-deck-p4/components/ui/CMakeLists.txt
            firmware/main-deck-p4/components/ui/ui_selected_api.c
            firmware/main-deck-p4/components/ui/ui_library_selected_api.c
            tests/run_p4_host_tests_current.ps1
