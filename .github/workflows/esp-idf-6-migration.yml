name: ESP-IDF 6.0.2 migration

on:
  push:
    branches:
      # master included deliberately: without it the gate stopped running the
      # moment work merged, so the default branch was never verified by the same
      # checks that guarded the branch it came from.
      #
      # migration/esp-idf-6.0.2 and fix/release-blockers-and-concurrency were
      # listed here and have both been merged and deleted. Naming branches
      # individually meant every new branch silently had no push CI - which is
      # how two later branches were pushed to five times without a single run,
      # and only got checked once a PR opened. Cover them by pattern instead, so
      # the gate follows the work rather than a list someone has to remember to
      # update.
      - master
      - "fix/**"
      - "test/**"
      - "docs/**"
      - "ci/**"
      - "migration/**"
  pull_request:
    paths:
      - "firmware/**"
      - "tests/**"
      - ".github/workflows/esp-idf-6-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes to the same ref are cancelled; a run on master is never
# cancelled, because that result is the record for the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner skips suites whose tooling is missing rather than failing the
      # whole gate, so anything installed here is the difference between a check
      # running and a warning nobody reads. ripgrep backs the dead-code
      # call-graph audit; cryptography backs the OTA signing tests.
      - name: Install host-suite tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          python3 -m pip install --quiet --upgrade cryptography

      - name: Run host regression suites
        shell: pwsh
        run: |
          & ./tests/run_s3_host_tests.ps1 *> s3-host-tests.log
          $s3 = $LASTEXITCODE
          $s3Lines = @(Get-Content s3-host-tests.log)
          if ($s3 -ne 0) {
              $s3Lines | Select-Object -Last 40
              exit $s3
          }
          Write-Host "S3 host tests passed ($(($s3Lines | Select-String -Pattern '^==> run ').Count) suites)."

          & ./tests/run_p4_host_tests.ps1 *> p4-host-tests.log
          $p4 = $LASTEXITCODE
          $p4Lines = @(Get-Content p4-host-tests.log)
          if ($p4 -ne 0) {
              $lastBuild = $p4Lines | Select-String -Pattern '^==> build ' | Select-Object -Last 1
              if ($lastBuild) {
                  $start = [Math]::Max(0, $lastBuild.LineNumber - 1)
                  $p4Lines[$start..($p4Lines.Count - 1)] | Select-Object -First 100
              } else {
                  $p4Lines | Select-Object -Last 60
              }
          } else {
              # A passing run used to print only the last 20 lines, which are
              # whichever static gates happen to sit at the end of the file. The
              # numbers worth reading -- how much actually executed, and that the
              # API contracts ran -- were invisible, so a suite silently losing
              # coverage looked identical to a healthy one.
              Write-Host "::group::P4 host suite summary"
              $suites = ($p4Lines | Select-String -Pattern '^==> run ').Count
              $gates  = ($p4Lines | Select-String -Pattern '^==> static ').Count
              $retired = ($p4Lines | Select-String -Pattern '^==> static retired API ').Count
              $wrappers = ($p4Lines | Select-String -Pattern '^==> static retired compilation wrapper ').Count
              Write-Host "compiled suites:            $suites"
              Write-Host "static gates:               $gates"
              Write-Host "retired APIs proven gone:   $retired"
              Write-Host "retired wrappers still out: $wrappers"
              Write-Host ""
              Write-Host "executed assertions per suite (floor enforced):"
              $p4Lines | Select-String -Pattern 'TESTS_RUN=\d+ \(floor \d+\)' |
                  ForEach-Object { Write-Host "  $($_.Line.Trim())" }
              Write-Host "::endgroup::"

              if ($retired -eq 0) {
                  Write-Host "::error::the retired-API contract did not run; tests/api_contract/retired is not being compiled"
                  exit 1
              }
              if ($wrappers -eq 0) {
                  Write-Host "::error::the retired-wrapper check did not run"
                  exit 1
              }
              $p4Lines | Select-Object -Last 20
          }

          # The runner deliberately skips a suite whose tooling is missing rather
          # than failing the whole gate, which is right for a workstation and
          # wrong here: on CI the tooling is installed above, so a skip means the
          # install broke and a check stopped running without anyone noticing.
          # That is exactly how the dead-code audit and the OTA signing tests
          # went unnoticed before they were installed.
          # Case-sensitive and anchored on the runner's own wording. A plain
          # case-insensitive 'skipping' also matches a suite's ordinary output,
          # such as the ANLZ test noting it has no real PDB fixture to read.
          $skipped = @($s3Lines) + @($p4Lines) |
              Select-String -CaseSensitive -Pattern 'SKIPPING the'
          if ($skipped) {
              Write-Host "::error::a host-suite check was skipped on CI; its tooling is expected to be installed"
              $skipped | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
              exit 1
          }
          exit $p4

      - name: Run UI simulator screenshot gate
        shell: pwsh
        run: |
          & ./tests/ui_simulator/run_ui_simulator_e2e.ps1 *> ui-simulator.log
          $ui = $LASTEXITCODE
          Get-Content ui-simulator.log | Select-Object -Last 100
          exit $ui

      - name: Upload host-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-test-logs
          if-no-files-found: ignore
          path: |
            s3-host-tests.log
            p4-host-tests.log
            ui-simulator.log

  build-s3:
    name: ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build control board
        run: |
          docker pull --quiet "$IDF_IMAGE" >/dev/null
          set +e
          docker run --rm \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR='*' \
            -v "$PWD:/project" \
            -w /project/firmware/control-board-s3 \
            "$IDF_IMAGE" bash -lc '
              idf.py --version
              rm -rf build sdkconfig sdkconfig.old managed_components
              idf.py set-target esp32s3
              idf.py build
            ' > s3-idf-build.log 2>&1
          code=$?
          # The IDF container runs as root and creates build/ through the bind
          # mount. Return ownership before runner-native provenance generation.
          if [ -d firmware/control-board-s3/build ]; then
            sudo chown -R "$(id -u):$(id -g)" firmware/control-board-s3/build
          fi
          if [ "$code" -ne 0 ]; then
            grep -nE '(^|[[:space:]])(CMake Error|ERROR:|error:|fatal error:|undefined reference|ninja: build stopped)' s3-idf-build.log | tail -n 75 || true
            tail -n 20 s3-idf-build.log
          else
            tail -n 25 s3-idf-build.log
          fi
          exit $code

      # The lock file is committed so a clean build resolves the same component
      # versions every time. idf.py rewrites it in place on drift, so without this
      # check a dependency could move silently and CI would still be green.
      - name: Verify committed dependency lock is unchanged
        run: |
          if ! git diff --exit-code -- firmware/control-board-s3/dependencies.lock; then
            echo "::error::dependencies.lock changed during the build; commit the new resolution or pin the drifting component"
            exit 1
          fi

      - name: Generate S3 build provenance
        run: |
          build_dir=firmware/control-board-s3/build
          lock=firmware/control-board-s3/dependencies.lock
          find "$build_dir" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -print0 | sort -z | xargs -0 sha256sum > "$build_dir/SHA256SUMS.txt"
          {
            echo "git_commit=$GITHUB_SHA"
            echo "repository=$GITHUB_REPOSITORY"
            echo "idf_version=ESP-IDF v6.0.2"
            echo "idf_image=$IDF_IMAGE"
            echo "dependencies_lock_sha256=$(sha256sum "$lock" | awk '{print $1}')"
            echo "firmware_sha256_manifest=SHA256SUMS.txt"
          } > "$build_dir/BUILD_PROVENANCE.txt"

      - name: Upload S3 build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-build-log
          path: s3-idf-build.log

      - name: Upload S3 binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-board-s3-idf-6.0.2
          path: |
            firmware/control-board-s3/build/*.bin
            firmware/control-board-s3/build/*.elf
            firmware/control-board-s3/build/*.map
            firmware/control-board-s3/build/BUILD_PROVENANCE.txt
            firmware/control-board-s3/build/SHA256SUMS.txt
            firmware/control-board-s3/dependencies.lock

  build-p4:
    name: ESP32-P4 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build main deck and verify silicon target
        run: |
          docker pull --quiet "$IDF_IMAGE" >/dev/null
          set +e
          docker run --rm \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR='*' \
            -v "$PWD:/project" \
            -w /project/firmware/main-deck-p4 \
            "$IDF_IMAGE" bash -lc '
              set -e
              idf.py --version
              rm -rf build sdkconfig sdkconfig.old managed_components
              idf.py set-target esp32p4
              idf.py reconfigure
              test -f build/config/sdkconfig.h
              grep -q "^#define CONFIG_ESP32P4_SELECTS_REV_LESS_V3 1$" build/config/sdkconfig.h
              grep -q "^#define CONFIG_ESP32P4_REV_MIN_FULL 100$" build/config/sdkconfig.h
              echo "Verified ESP32-P4 production silicon gate: pre-v3 selector enabled, minimum revision 1.0."
              idf.py build
            ' > p4-idf-build.log 2>&1
          code=$?
          # The IDF container runs as root and creates build/ through the bind
          # mount. Return ownership before runner-native verification and
          # provenance generation.
          if [ -d firmware/main-deck-p4/build ]; then
            sudo chown -R "$(id -u):$(id -g)" firmware/main-deck-p4/build
          fi
          if [ "$code" -ne 0 ]; then
            grep -nE '(^|[[:space:]])(CMake Error|ERROR:|error:|fatal error:|undefined reference|ninja: build stopped|CONFIG_ESP32P4)' p4-idf-build.log | tail -n 90 || true
            tail -n 25 p4-idf-build.log
          else
            tail -n 30 p4-idf-build.log
          fi
          exit $code

      - name: Verify committed dependency lock is unchanged
        run: |
          if ! git diff --exit-code -- firmware/main-deck-p4/dependencies.lock; then
            echo "::error::dependencies.lock changed during the build; commit the new resolution or pin the drifting component"
            exit 1
          fi

      # A --wrap that fails to bind is worse than no wrapper: the build succeeds,
      # the CMake text still says the shim is there, and the panic comes back on
      # hardware. Check the linked image rather than the build files - the
      # wrapper must be present and the unwrapped original must be gone.
      - name: Verify the USB DWC decoder wrap bound in the linked image
        run: |
          docker run --rm -e HOME=/tmp -v "$PWD:/project" -w /project/firmware/main-deck-p4 \
            "$IDF_IMAGE" bash -lc '
              set -e
              elf=build/main-deck-p4.elf
              test -f "$elf"
              if ! riscv32-esp-elf-nm "$elf" | grep -q " T __wrap_usb_dwc_hal_chan_decode_intr$"; then
                echo "::error::__wrap_usb_dwc_hal_chan_decode_intr is not in the image; the --wrap did not bind"
                exit 1
              fi
              if riscv32-esp-elf-nm "$elf" | grep -q " T usb_dwc_hal_chan_decode_intr$"; then
                echo "::error::the unwrapped DWC decoder is still linked; the BNA assert is reachable"
                exit 1
              fi
              echo "USB DWC decoder wrap verified in the linked image."
            '

      - name: Generate P4 build provenance
        run: |
          build_dir=firmware/main-deck-p4/build
          lock=firmware/main-deck-p4/dependencies.lock
          find "$build_dir" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -print0 | sort -z | xargs -0 sha256sum > "$build_dir/SHA256SUMS.txt"
          {
            echo "git_commit=$GITHUB_SHA"
            echo "repository=$GITHUB_REPOSITORY"
            echo "idf_version=ESP-IDF v6.0.2"
            echo "idf_image=$IDF_IMAGE"
            echo "dependencies_lock_sha256=$(sha256sum "$lock" | awk '{print $1}')"
            echo "firmware_sha256_manifest=SHA256SUMS.txt"
          } > "$build_dir/BUILD_PROVENANCE.txt"

      - name: Upload P4 build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p4-build-log
          path: p4-idf-build.log

      - name: Upload P4 binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-deck-p4-idf-6.0.2
          path: |
            firmware/main-deck-p4/build/*.bin
            firmware/main-deck-p4/build/*.elf
            firmware/main-deck-p4/build/*.map
            firmware/main-deck-p4/build/BUILD_PROVENANCE.txt
            firmware/main-deck-p4/build/SHA256SUMS.txt
            firmware/main-deck-p4/dependencies.lock
