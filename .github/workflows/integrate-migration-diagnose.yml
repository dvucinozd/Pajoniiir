name: Temporary migration integration validation

on:
  pull_request:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - ".github/workflows/integrate-migration-diagnose.yml"

permissions:
  contents: write

env:
  IDF_IMAGE: espressif/idf:v6.0.2
  FEATURE_BRANCH: fix/release-blockers-and-concurrency
  FEATURE_SHA: 3744902b3afb19971fd5345966ae943abe7af722
  MIGRATION_BRANCH: migration/esp-idf-6.0.2
  MIGRATION_SHA: 838e78186521abb998af9c9cef9f93dc25cde633

jobs:
  integrate-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out tooling revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge migration and resolve audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH" "$MIGRATION_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$FEATURE_SHA"
          test "$(git rev-parse origin/$MIGRATION_BRANCH)" = "$MIGRATION_SHA"
          git checkout -B integration-work "origin/$FEATURE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff "origin/$MIGRATION_BRANCH" > merge-output.txt 2>&1
          merge_rc=$?
          set -e
          test "$merge_rc" -eq 1
          git diff --name-only --diff-filter=U | sort > conflict-files.txt
          cat > expected-conflicts.txt <<'EOF'
          docs/fixevi-remediation-audit.md
          tests/run_p4_host_tests_current.ps1
          EOF
          sed -i 's/^          //' expected-conflicts.txt
          diff -u expected-conflicts.txt conflict-files.txt

          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "docs/fixevi-remediation-audit.md",
              "tests/run_p4_host_tests_current.ps1",
          ):
              path = Path(name)
              lines = path.read_text(encoding="utf-8-sig").splitlines(keepends=True)
              out = []
              i = 0
              conflicts = 0
              while i < len(lines):
                  if not lines[i].startswith("<<<<<<< "):
                      out.append(lines[i])
                      i += 1
                      continue
                  conflicts += 1
                  i += 1
                  ours = []
                  while i < len(lines) and not lines[i].startswith("======="):
                      ours.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise SystemExit(f"unterminated conflict in {name}")
                  i += 1
                  while i < len(lines) and not lines[i].startswith(">>>>>>> "):
                      i += 1
                  if i >= len(lines):
                      raise SystemExit(f"unterminated conflict in {name}")
                  i += 1
                  out.extend(ours)
              if conflicts == 0:
                  raise SystemExit(f"expected conflict markers in {name}")
              path.write_text("".join(out), encoding="utf-8", newline="")
          PY

          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
              docs/fixevi-remediation-audit.md \
              tests/run_p4_host_tests_current.ps1
          git add docs/fixevi-remediation-audit.md tests/run_p4_host_tests_current.ps1
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git status --short > merge-status.txt

      - name: Run full host regression suites
        shell: pwsh
        run: |
          & ./tests/run_s3_host_tests.ps1 *> s3-host-tests.log
          $s3 = $LASTEXITCODE
          if ($s3 -ne 0) {
              Get-Content s3-host-tests.log -Tail 80
              exit $s3
          }
          & ./tests/run_p4_host_tests_current.ps1 *> p4-host-tests.log
          $p4 = $LASTEXITCODE
          Get-Content p4-host-tests.log | Select-Object -Last 120
          exit $p4

      - name: Run UI simulator screenshot gate
        shell: pwsh
        run: |
          & ./tests/ui_simulator/run_ui_simulator_e2e.ps1 *> ui-simulator.log
          $code = $LASTEXITCODE
          Get-Content ui-simulator.log | Select-Object -Last 120
          exit $code

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet "$IDF_IMAGE" >/dev/null
          set +e
          docker run --rm \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR='*' \
            -v "$PWD:/project" \
            -w /project/firmware/control-board-s3 \
            "$IDF_IMAGE" bash -lc '
              idf.py --version
              rm -rf build sdkconfig sdkconfig.old managed_components
              idf.py set-target esp32s3
              idf.py build
            ' > s3-idf-build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            grep -nE '(^|[[:space:]])(CMake Error|ERROR:|error:|fatal error:|undefined reference|ninja: build stopped)' s3-idf-build.log | tail -n 100 || true
            tail -n 40 s3-idf-build.log
          else
            tail -n 25 s3-idf-build.log
          fi
          exit "$code"

      - name: Build ESP32-P4 firmware
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR='*' \
            -v "$PWD:/project" \
            -w /project/firmware/main-deck-p4 \
            "$IDF_IMAGE" bash -lc '
              set -e
              idf.py --version
              rm -rf build sdkconfig sdkconfig.old managed_components
              idf.py set-target esp32p4
              idf.py reconfigure
              test -f build/config/sdkconfig.h
              grep -q "^#define CONFIG_ESP32P4_SELECTS_REV_LESS_V3 1$" build/config/sdkconfig.h
              grep -q "^#define CONFIG_ESP32P4_REV_MIN_FULL 100$" build/config/sdkconfig.h
              idf.py build
            ' > p4-idf-build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            grep -nE '(^|[[:space:]])(CMake Error|ERROR:|error:|fatal error:|undefined reference|ninja: build stopped|CONFIG_ESP32P4)' p4-idf-build.log | tail -n 120 || true
            tail -n 40 p4-idf-build.log
          else
            tail -n 30 p4-idf-build.log
          fi
          exit "$code"

      - name: Publish validated merge commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH" "$MIGRATION_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$FEATURE_SHA"
          test "$(git rev-parse origin/$MIGRATION_BRANCH)" = "$MIGRATION_SHA"
          git diff --check
          git commit -m "merge: integrate ESP-IDF 6.0.2 migration head"
          test "$(git rev-parse HEAD^1)" = "$FEATURE_SHA"
          test "$(git rev-parse HEAD^2)" = "$MIGRATION_SHA"
          git push origin "HEAD:$FEATURE_BRANCH"

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-integration-validation-logs
          if-no-files-found: ignore
          path: |
            merge-output.txt
            merge-status.txt
            conflict-files.txt
            s3-host-tests.log
            p4-host-tests.log
            ui-simulator.log
            s3-idf-build.log
            p4-idf-build.log
