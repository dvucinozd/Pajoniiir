name: Apply release audit phase 7 control queue

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - "tools/apply_release_audit_phase7_control_queue.py"
      - ".github/workflows/apply-release-audit-phase7-control-queue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0

      - name: Apply queue ownership fixes
        run: python3 tools/apply_release_audit_phase7_control_queue.py

      - name: Verify source invariants
        run: |
          git diff --check
          ! grep -q 'xQueueReceive(s_event_queue' firmware/main-deck-p4/components/control_link/control_link_uart.c
          grep -q 'store_pending_continuous' firmware/main-deck-p4/components/control_link/control_link_uart.c
          grep -q 'portMAX_DELAY' firmware/main-deck-p4/components/control_link/control_link_uart.c

      - name: Commit control queue fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main-deck-p4/components/control_link/control_link_uart.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(p4): make control edges lossless without queue draining"
          git pull --rebase origin fix/release-blockers-and-concurrency
          git push origin HEAD:fix/release-blockers-and-concurrency
