name: Apply release audit phase 3 S3 debug AP

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - "tools/apply_release_audit_phase3_s3_debug_ap.py"
      - ".github/workflows/apply-release-audit-phase3-s3-debug-ap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0

      - name: Apply S3 debug AP fixes
        run: python3 tools/apply_release_audit_phase3_s3_debug_ap.py

      - name: Verify source and static gates
        shell: pwsh
        run: |
          git diff --check
          $src = Get-Content firmware/control-board-s3/components/s3_debug_ap/s3_debug_ap.c -Raw
          if ($src -match 'for \(int i = 0; i < 600; i\+\+\)') { throw 'blocking SSE loop remains' }
          if ($src -notmatch 's_ap_start_failed_latched') { throw 'AP error latch missing' }
          if ($src -notmatch 'X-Log-Seq') { throw 'bounded log polling sequence missing' }

      - name: Commit S3 debug AP fixes
        run: |
          if git diff --quiet -- firmware/control-board-s3/components/s3_debug_ap/s3_debug_ap.c; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/control-board-s3/components/s3_debug_ap/s3_debug_ap.c
          git commit -m "fix(s3): make debug AP HTTP bounded and latch failures"
          git push origin HEAD:fix/release-blockers-and-concurrency
