name: Apply release audit phase 5 ANLZ ownership

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - "tools/apply_release_audit_phase5_anlz_ownership.py"
      - ".github/workflows/apply-release-audit-phase5-anlz.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0

      - name: Apply owned ANLZ snapshot fixes
        run: python3 tools/apply_release_audit_phase5_anlz_ownership.py

      - name: Verify patch
        run: |
          git diff --check
          ! grep -q 'loaded_anlz_for_deck(' firmware/main-deck-p4/components/deck_core/deck_core.c
          grep -q 'ui_clone_deck_anlz_metadata' firmware/main-deck-p4/components/deck_core/deck_core.c
          grep -q 'ui_deck_anlz_store_clone' firmware/main-deck-p4/components/ui/ui_deck_anlz_store.c

      - name: Commit ANLZ ownership fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main-deck-p4/components/ui/include/ui_deck_anlz_store.h \
                  firmware/main-deck-p4/components/ui/ui_deck_anlz_store.c \
                  firmware/main-deck-p4/components/ui/include/ui.h \
                  firmware/main-deck-p4/components/ui/ui.c \
                  firmware/main-deck-p4/components/deck_core/deck_core.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(p4): use owned ANLZ snapshots across tasks"
          git pull --rebase origin fix/release-blockers-and-concurrency
          git push origin HEAD:fix/release-blockers-and-concurrency
