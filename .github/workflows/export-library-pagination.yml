name: Temporary library pagination source export

on:
  pull_request:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - ".github/workflows/export-library-pagination.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tested source tree
        shell: bash
        run: git archive --format=tar.gz -o pajoniiir-library-pagination.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pajoniiir-library-pagination-source
          path: pajoniiir-library-pagination.tar.gz
          if-no-files-found: error
