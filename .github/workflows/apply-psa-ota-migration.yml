name: Apply PSA OTA migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'migration/esp-idf-6.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/esp-idf-6.0.2
          fetch-depth: 0
      - name: Replace legacy SHA-256 calls with PSA Crypto
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          crypto = 'firmware/common/ota_manifest/ota_manifest_crypto.c'
          replace(crypto, '#include "mbedtls/sha256.h"', '#include "psa/crypto.h"')
          replace(
              crypto,
              '''    uint8_t digest[DDJ_OTA_SHA256_SIZE];
              if (mbedtls_sha256(header, DDJ_OTA_SIGNED_SIZE, digest, 0) != 0) return false;
              ''',
              '''    uint8_t digest[DDJ_OTA_SHA256_SIZE];
              size_t digest_len = 0u;
              if (psa_hash_compute(PSA_ALG_SHA_256,
                                   header,
                                   DDJ_OTA_SIGNED_SIZE,
                                   digest,
                                   sizeof(digest),
                                   &digest_len) != PSA_SUCCESS ||
                  digest_len != sizeof(digest)) {
                  return false;
              }
              ''')
          replace(
              crypto,
              '''    if (rc != 0 || !mbedtls_pk_can_do(&key, MBEDTLS_PK_ECDSA)) {
              ''',
              '''    if (rc != 0) {
              ''')

          def migrate_streaming_ota(path_str, prefix):
              replace(path_str, '#include "mbedtls/sha256.h"', '#include "psa/crypto.h"')
              replace(
                  path_str,
                  'static mbedtls_sha256_context s_image_sha;',
                  'static psa_hash_operation_t s_image_sha = PSA_HASH_OPERATION_INIT;')
              replace(
                  path_str,
                  '''        mbedtls_sha256_free(&s_image_sha);
                          s_image_sha_active = false;
                  ''',
                  '''        (void)psa_hash_abort(&s_image_sha);
                          s_image_sha = psa_hash_operation_init();
                          s_image_sha_active = false;
                  ''')
              replace(
                  path_str,
                  '''    mbedtls_sha256_init(&s_image_sha);
                      if (mbedtls_sha256_starts(&s_image_sha, 0) != 0) {
                  ''',
                  '''    s_image_sha = psa_hash_operation_init();
                      if (psa_hash_setup(&s_image_sha, PSA_ALG_SHA_256) != PSA_SUCCESS) {
                  ''')
              replace(
                  path_str,
                  '        if (mbedtls_sha256_update(&s_image_sha, data, size) == 0) {',
                  '        if (psa_hash_update(&s_image_sha, data, size) == PSA_SUCCESS) {')
              replace(
                  path_str,
                  '''    uint8_t actual_sha256[DDJ_OTA_SHA256_SIZE];
                      esp_err_t rc = mbedtls_sha256_finish(&s_image_sha, actual_sha256) == 0 ? ESP_OK : ESP_FAIL;
                      mbedtls_sha256_free(&s_image_sha);
                      s_image_sha_active = false;
                  ''',
                  '''    uint8_t actual_sha256[DDJ_OTA_SHA256_SIZE];
                      size_t actual_sha256_len = 0u;
                      psa_status_t hash_status = psa_hash_finish(&s_image_sha,
                                                                 actual_sha256,
                                                                 sizeof(actual_sha256),
                                                                 &actual_sha256_len);
                      esp_err_t rc = hash_status == PSA_SUCCESS &&
                                     actual_sha256_len == sizeof(actual_sha256)
                                         ? ESP_OK
                                         : ESP_FAIL;
                      s_image_sha = psa_hash_operation_init();
                      s_image_sha_active = false;
                  ''')

          migrate_streaming_ota('firmware/control-board-s3/components/s3_ota/s3_ota.c', 's3')
          migrate_streaming_ota('firmware/main-deck-p4/components/p4_ota/p4_ota.c', 'p4')

          pull = 'firmware/main-deck-p4/components/p4_ota_pull/p4_ota_pull.c'
          replace(pull, '#include "mbedtls/sha256.h"', '#include "psa/crypto.h"')
          replace(
              pull,
              '''    mbedtls_sha256_context bundle_sha;
                  mbedtls_sha256_init(&bundle_sha);
                  bool sha_started = mbedtls_sha256_starts(&bundle_sha, 0) == 0;
                  if (!sha_started) {
                      free(buf);
                      esp_http_client_cleanup(client);
                      mbedtls_sha256_free(&bundle_sha);
                      return ESP_FAIL;
                  }
              ''',
              '''    psa_hash_operation_t bundle_sha = PSA_HASH_OPERATION_INIT;
                  bool sha_started = psa_hash_setup(&bundle_sha, PSA_ALG_SHA_256) == PSA_SUCCESS;
                  if (!sha_started) {
                      free(buf);
                      esp_http_client_cleanup(client);
                      (void)psa_hash_abort(&bundle_sha);
                      return ESP_FAIL;
                  }
              ''')
          replace(
              pull,
              '    if (mbedtls_sha256_update(&bundle_sha, header, sizeof(header)) != 0) {',
              '    if (psa_hash_update(&bundle_sha, header, sizeof(header)) != PSA_SUCCESS) {')
          replace(
              pull,
              '        if (mbedtls_sha256_update(&bundle_sha, buf, (size_t)got) != 0) {',
              '        if (psa_hash_update(&bundle_sha, buf, (size_t)got) != PSA_SUCCESS) {')
          replace(
              pull,
              '''    uint8_t actual_sha256[32];
                  if (mbedtls_sha256_finish(&bundle_sha, actual_sha256) != 0) {
                      p4_ota_abort("bundle hash failed");
                      rc = ESP_FAIL;
                      goto done;
                  }
                  sha_started = false;
              ''',
              '''    uint8_t actual_sha256[32];
                  size_t actual_sha256_len = 0u;
                  if (psa_hash_finish(&bundle_sha,
                                      actual_sha256,
                                      sizeof(actual_sha256),
                                      &actual_sha256_len) != PSA_SUCCESS ||
                      actual_sha256_len != sizeof(actual_sha256)) {
                      p4_ota_abort("bundle hash failed");
                      rc = ESP_FAIL;
                      goto done;
                  }
                  sha_started = false;
              ''')
          replace(
              pull,
              '''done:
                  if (sha_started) {
                      uint8_t discard[32];
                      (void)mbedtls_sha256_finish(&bundle_sha, discard);
                  }
                  mbedtls_sha256_free(&bundle_sha);
              ''',
              '''done:
                  if (sha_started) {
                      (void)psa_hash_abort(&bundle_sha);
                  }
              ''')

          shim = Path('firmware/common/ota_manifest/include/mbedtls/sha256.h')
          if shim.exists():
              shim.unlink()
          PY
          git config user.name "Pajoniiir migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add firmware/common/ota_manifest firmware/control-board-s3/components/s3_ota firmware/main-deck-p4/components/p4_ota firmware/main-deck-p4/components/p4_ota_pull
          git commit -m "crypto: migrate signed OTA hashing to PSA Crypto"
          git push origin HEAD:migration/esp-idf-6.0.2
