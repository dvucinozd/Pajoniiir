name: Normalize ordered documentation formatting

on:
  push:
    branches:
      - tmp/ordered-cleanup
    paths:
      - tools/fix_claude_docs_indent.py
      - .github/workflows/fix-ordered-doc-indent.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ordered-cleanup
          fetch-depth: 0
      - run: python3 tools/fix_claude_docs_indent.py
      - name: Verify Markdown and stale markers
        run: |
          git diff --check
          ! grep -q '^    ESP-IDF' firmware/main-deck-p4/CLAUDE.md
          ! grep -q 'CONFIG_ESP32P4_REV_MIN_FULL=0' firmware/main-deck-p4/CLAUDE.md
          ! grep -q 'display triple buffering' firmware/main-deck-p4/CLAUDE.md
          grep -q '^> CONFIG_ESP32P4_REV_MIN_FULL=100' firmware/main-deck-p4/CLAUDE.md
          grep -q 'BSP_LCD_FRAMEBUFFER_COUNT == 1' firmware/main-deck-p4/CLAUDE.md
      - name: Commit formatting fix and self-clean
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm tools/fix_claude_docs_indent.py .github/workflows/fix-ordered-doc-indent.yml
          git add firmware/main-deck-p4/CLAUDE.md
          git commit -m "docs(p4): normalize refreshed guide formatting"
          git push origin HEAD:tmp/ordered-cleanup
