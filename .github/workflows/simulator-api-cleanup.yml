name: Temporary tooling branch cleanup

on:
  pull_request:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - ".github/workflows/simulator-api-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete temporary branches
        shell: bash
        run: |
          set -euxo pipefail
          git push origin --delete tooling/mock-api-inventory || true
          git push origin --delete tooling/simulator-api-cleanup || true
