name: Apply library strings header

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'migration/esp-idf-6.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/esp-idf-6.0.2
          fetch-depth: 0
      - name: Declare strcasecmp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('firmware/main-deck-p4/components/library/library.c')
          text = path.read_text(encoding='utf-8')
          old = '#include <string.h>\n#include <stdio.h>'
          new = '#include <string.h>\n#include <strings.h>\n#include <stdio.h>'
          if old not in text:
              raise SystemExit('library include anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "Pajoniiir migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add firmware/main-deck-p4/components/library/library.c
          git commit -m "fix(p4): declare POSIX case-insensitive string comparison"
          git push origin HEAD:migration/esp-idf-6.0.2
