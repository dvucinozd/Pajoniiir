name: Apply release audit phase 1

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - "tools/apply_release_audit_phase1.py"
      - ".github/workflows/apply-release-audit-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0

      - name: Apply deterministic source transformations
        run: python3 tools/apply_release_audit_phase1.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit phase-one fixes
        run: |
          if git diff --quiet; then
            echo "No changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main-deck-p4/components/ui/ui_library.c \
                  firmware/main-deck-p4/components/web_server/web_server.c \
                  firmware/main-deck-p4/components/web_server/web/app.js
          git commit -m "fix: make library loads transactional and identity based"
          git push origin HEAD:fix/release-blockers-and-concurrency
