name: Apply host Python portability

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'migration/esp-idf-6.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/esp-idf-6.0.2
          fetch-depth: 0
      - name: Make the Python environment probe platform-aware
        shell: pwsh
        run: |
          $path = "tests/run_p4_host_tests.ps1"
          $text = Get-Content -LiteralPath $path -Raw
          $old = @'
          $pythonSource = $null
          foreach ($candidate in @($env:IDF_PYTHON_ENV_PATH, "C:\Espressif\python_env\idf5.5_py3.11_env")) {
              if ($candidate) {
                  $exe = Join-Path $candidate "Scripts\python.exe"
                  if (Test-Path $exe) { $pythonSource = $exe; break }
              }
          }
          '@
          $new = @'
          $pythonSource = $null
          $isWindowsHost = $env:OS -eq "Windows_NT"
          $pythonCandidates = @()
          if ($env:IDF_PYTHON_ENV_PATH) {
              $pythonCandidates += $env:IDF_PYTHON_ENV_PATH
          }
          if ($isWindowsHost) {
              $pythonCandidates += "C:\Espressif\python_env\idf5.5_py3.11_env"
          }
          foreach ($candidate in $pythonCandidates) {
              $relativeExe = $isWindowsHost ? "Scripts\python.exe" : "bin/python"
              $exe = Join-Path $candidate $relativeExe
              if (Test-Path -LiteralPath $exe) { $pythonSource = $exe; break }
          }
          '@
          if (-not $text.Contains($old)) {
              throw "Python environment probe block not found"
          }
          $text = $text.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $text -NoNewline
          git config user.name "Pajoniiir migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add $path
          git commit -m "test: make P4 Python environment probing portable"
          git push origin HEAD:migration/esp-idf-6.0.2
