name: Apply controller POSIX feature declaration

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'migration/esp-idf-6.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/esp-idf-6.0.2
          fetch-depth: 0
      - name: Expose fileno to the C99 host build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('firmware/main-deck-p4/components/controller_profile_manager/controller_profile_manager.c')
          text = path.read_text(encoding='utf-8')
          old = '#include "controller_profile_manager.h"\n'
          new = '''#if defined(CONTROLLER_PROFILE_MANAGER_PC_TEST) && !defined(_WIN32) && !defined(_POSIX_C_SOURCE)\n#define _POSIX_C_SOURCE 200809L\n#endif\n\n#include "controller_profile_manager.h"\n'''
          if old not in text:
              raise SystemExit('controller profile include anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "Pajoniiir migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add firmware/main-deck-p4/components/controller_profile_manager/controller_profile_manager.c
          git commit -m "fix(p4): expose POSIX file sync API in host tests"
          git push origin HEAD:migration/esp-idf-6.0.2
