name: Apply IDF6 manifest pins

on:
  push:
    branches:
      - migration/esp-idf-6.0.2
    paths:
      - ".github/workflows/apply-idf6-manifest-pins.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/esp-idf-6.0.2
          fetch-depth: 0
      - name: Pin every project component manifest to ESP-IDF 6.0.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path("firmware").rglob("idf_component.yml"):
              text = path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'(?m)^(\s*idf:\s*)"(?:\^5\.4|>=5\.[0-9]+(?:\.[0-9]+)?)"\s*$',
                  r'\1"==6.0.2"',
                  text,
              )
              updated = re.sub(
                  r'(?m)^(\s*idf:\s*\n\s*version:\s*)"(?:\^5\.4|>=5\.[0-9]+(?:\.[0-9]+)?)"\s*$',
                  r'\1"==6.0.2"',
                  updated,
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated manifests:")
          for path in changed:
              print(f"  {path}")
          if not changed:
              raise SystemExit("No remaining ESP-IDF 5.x manifest constraints found")
          PY
      - name: Commit manifest pins
        run: |
          git config user.name "Pajoniiir migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'firmware/**/idf_component.yml'
          git commit -m "build: pin all component manifests to ESP-IDF 6.0.2"
          git push origin HEAD:migration/esp-idf-6.0.2
