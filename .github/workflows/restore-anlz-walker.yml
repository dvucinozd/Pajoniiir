name: Restore ANLZ parser with bounded walker

on:
  push:
    branches:
      - tmp/ordered-cleanup
    paths:
      - tools/restore_anlz_walker_patch.py
      - .github/workflows/restore-anlz-walker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ordered-cleanup
          fetch-depth: 0
      - name: Restore parser and patch walker
        run: python3 tools/restore_anlz_walker_patch.py
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --numstat 267953d52b8035e78f818ae196cd99ee4a7e3534 -- firmware/main-deck-p4/components/library/rekordbox_anlz.c | awk '{print $1+$2}')" -lt 30
          grep -q 'return pos == file_len ? TAG_WALK_ABSENT : TAG_WALK_MALFORMED' firmware/main-deck-p4/components/library/rekordbox_anlz.c
          grep -q 'static esp_err_t parse_pwv3' firmware/main-deck-p4/components/library/rekordbox_anlz.c
      - name: Commit and self-clean
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm tools/restore_anlz_walker_patch.py .github/workflows/restore-anlz-walker.yml
          git add firmware/main-deck-p4/components/library/rekordbox_anlz.c
          git commit -m "fix(anlz): reject malformed section envelopes"
          git push origin HEAD:tmp/ordered-cleanup
