name: Apply release audit phase 6 audio lifecycle

on:
  push:
    branches:
      - fix/release-blockers-and-concurrency
    paths:
      - "tools/apply_release_audit_phase6_audio_lifecycle.py"
      - ".github/workflows/apply-release-audit-phase6-audio-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-blockers-and-concurrency
          fetch-depth: 0

      - name: Apply audio lifecycle fixes
        run: python3 tools/apply_release_audit_phase6_audio_lifecycle.py

      - name: Verify source invariants
        run: |
          git diff --check
          ! grep -q 'if (!eng->loaded) return ESP_OK' firmware/main-deck-p4/components/audio_engine/audio_engine.c
          grep -q 'TRACK TOO LARGE' firmware/main-deck-p4/components/audio_engine/audio_engine.c
          grep -q 's_master_tempo_command_epoch' firmware/main-deck-p4/components/audio_engine/audio_engine.c
          grep -q '((uint64_t)position_ms' firmware/main-deck-p4/components/audio_engine/audio_engine.c

      - name: Commit audio lifecycle fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main-deck-p4/components/audio_engine/audio_engine.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(p4): harden audio load sessions and DSP commands"
          git pull --rebase origin fix/release-blockers-and-concurrency
          git push origin HEAD:fix/release-blockers-and-concurrency
